[galaxy]
server_list = automation_hub_published, automation_hub_validated

[galaxy_server.automation_hub_published]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# Token: set ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_PUBLISHED_TOKEN as a repository secret

[galaxy_server.automation_hub_validated]
url = https://console.redhat.com/api/automation-hub/content/published/
auth_url = https://sso.redhat.com/auth/realms/redhat-external/protocol/openid-connect/token
# Token: set ANSIBLE_GALAXY_SERVER_AUTOMATION_HUB_VALIDATED_TOKEN as a repository secret
